services:
  backend:
    build: ./backend

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    depends_on:
      ollama:
        condition: service_started

    volumes:
      - chroma_data:/app/chroma_data

    restart: unless-stopped

  frontend:
    build: ./frontend

    ports:
      - "127.0.0.1:8501:8501"

    environment:
      BACKEND_URL: http://backend:8000

    depends_on:
      backend:
        condition: service_started

    restart: unless-stopped

  ollama:
    image: ollama/ollama

    volumes:
      - ollama_data:/root/.ollama

    restart: unless-stopped

volumes:
  chroma_data:
  ollama_data: